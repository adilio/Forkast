<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f3ee" />
    <script>
      // Resolve the theme before first paint: a saved choice wins, otherwise
      // the device decides. Without this the app flashes a lit kitchen at
      // someone reading a recipe in a dark one.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('forkast:theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#131714');
        }
      })();
    </script>
    <meta
      name="description"
      content="Private household recipes and store-aware shopping lists."
    />
    <link rel="icon" href="/forkast-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="Forkast" />
    <meta property="og:title" content="Forkast" />
    <meta
      property="og:description"
      content="Private household recipes and store-aware shopping lists."
    />
    <meta property="og:url" content="https://forkast.4dl.ca/" />
    <meta property="og:type" content="website" />
    <!-- Regenerate with `npm run og` after changing the card or its copy. -->
    <meta property="og:image" content="https://forkast.4dl.ca/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Forkast: capture a recipe, scale it, shop it. A prep ticket for a six-serving weeknight chili, each ingredient tagged with the store it is bought at."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forkast" />
    <meta
      name="twitter:description"
      content="Private household recipes and store-aware shopping lists."
    />
    <meta name="twitter:image" content="https://forkast.4dl.ca/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Forkast: capture a recipe, scale it, shop it. A prep ticket for a six-serving weeknight chili, each ingredient tagged with the store it is bought at."
    />
    <title>Forkast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
